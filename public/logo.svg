<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="ambientGlow" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>

    <!-- Pillar Gradient -->
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Upper Arm Gradient -->
    <linearGradient id="upperGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#00BBF9"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>

    <!-- Lower Arm Gradient -->
    <linearGradient id="lowerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#dropShadow)"/>

  <!-- Ambient Light -->
  <circle cx="256" cy="256" r="180" fill="url(#ambientGlow)"/>

  <!-- Subtle Circuit Dots & Trace -->
  <g opacity="0.35" stroke="#38BDF8" stroke-width="2" fill="none">
    <path d="M 165 80 L 165 110" stroke-dasharray="4,4"/>
    <path d="M 390 220 L 420 220" stroke-dasharray="4,4"/>
    <path d="M 370 380 L 400 410"/>
    <circle cx="165" cy="80" r="3" fill="#38BDF8"/>
    <circle cx="420" cy="220" r="3" fill="#38BDF8"/>
    <circle cx="400" cy="410" r="3" fill="#C084FC"/>
  </g>

  <!-- Lower Arm (drawn first, underneath) -->
  <line x1="220" y1="240" x2="345" y2="365" stroke="url(#lowerGrad)" stroke-width="58" stroke-linecap="round" filter="url(#dropShadow)"/>
  <line x1="225" y1="235" x2="340" y2="350" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.25"/>

  <!-- Left Vertical Pillar -->
  <rect x="136" y="118" width="58" height="276" rx="29" fill="url(#pillarGrad)" filter="url(#dropShadow)"/>
  <!-- Pillar Specular Highlight -->
  <rect x="142" y="126" width="16" height="260" rx="8" fill="#FFFFFF" opacity="0.25"/>

  <!-- Upper Arm (sweeps forward/up over pillar junction) -->
  <line x1="205" y1="275" x2="345" y2="145" stroke="url(#upperGrad)" stroke-width="58" stroke-linecap="round" filter="url(#dropShadow)"/>
  <line x1="215" y1="265" x2="335" y2="155" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.35"/>

  <!-- Central Intelligence Core Node -->
  <circle cx="216" cy="260" r="19" fill="#0F172A" stroke="#00F5D4" stroke-width="4" filter="url(#dropShadow)"/>
  <circle cx="216" cy="260" r="8.5" fill="#00F5D4" filter="url(#neonGlow)"/>
  <circle cx="216" cy="260" r="3.5" fill="#FFFFFF"/>

  <!-- Sparkle Accent at Upper Right -->
  <g transform="translate(382, 106)" fill="#00F5D4" filter="url(#neonGlow)">
    <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
  </g>
</svg>